<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Task Tracker</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #e4e7ec;
      --text: #111827;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --accent: #6366f1;
      --accent-light: #eef2ff;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warn: #f59e0b;
      --warn-light: #fffbeb;
      --purple: #8b5cf6;
      --purple-light: #f5f3ff;
      --teal: #0d9488;
      --teal-light: #f0fdfa;
      --orange: #f97316;
      --orange-light: #fff7ed;
      --pink: #ec4899;
      --pink-light: #fdf2f8;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 14px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.11), 0 2px 6px rgba(0,0,0,0.06);
      --t: 0.18s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Auth ── */
    .auth-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: radial-gradient(ellipse at 60% 40%, #eef2ff 0%, #f0f2f5 60%);
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 44px 36px; max-width: 380px; width: 100%; text-align: center;
      box-shadow: var(--shadow);
    }
    .auth-logo { font-size: 2.8rem; margin-bottom: 14px; }
    .auth-card h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .auth-card p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 28px; }
    .auth-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 11px 14px; font-size: 0.9rem; margin-bottom: 12px; outline: none;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .auth-btn {
      width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background var(--t), transform var(--t), box-shadow var(--t);
    }
    .auth-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
    .auth-btn:active { transform: translateY(0); }
    .auth-error { color: var(--danger); font-size: 0.8rem; margin-top: 8px; }

    .app { display: none; }

    /* ── Header ── */
    .header {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 13px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { font-size: 1.35rem; }
    .header-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-sub { font-size: 0.7rem; color: var(--text-muted); }
    .stats { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .stat-pill {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; color: var(--text-muted);
    }
    .stat-pill .n { font-weight: 700; font-size: 0.88rem; }
    .stat-pill.s-over .n { color: var(--danger); }
    .stat-pill.s-active .n { color: var(--accent); }
    .stat-pill.s-done .n { color: var(--success); }
    .progress-pill {
      display: flex; align-items: center; gap: 7px; padding: 4px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
    }
    .prog-track { width: 52px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill {
      height: 100%; background: linear-gradient(90deg, var(--success), #34d399);
      border-radius: 3px; transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }
    .prog-pct { font-size: 0.73rem; font-weight: 600; color: var(--success); }
    .sync-pill { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted); padding: 4px 10px; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; transition: background 0.3s; }
    .sync-dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
    .sync-dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Main ── */
    .main { padding: 22px 28px; max-width: 980px; margin: 0 auto; }

    /* ── Add form ── */
    .add-form {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm); transition: box-shadow var(--t);
    }
    .add-form:focus-within { box-shadow: var(--shadow); }
    .add-form-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .add-form-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .kbd { font-size: 0.67rem; color: var(--text-light); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-family: monospace; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.71rem; font-weight: 500; color: var(--text-muted); }
    .form-group.task-name { flex: 1; min-width: 200px; }
    input[type="text"], input[type="date"], select, textarea {
      border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 11px;
      font-size: 0.875rem; color: var(--text); background: #fff; outline: none;
      transition: border-color var(--t), box-shadow var(--t); font-family: inherit;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); background: #fff;
    }
    textarea { resize: vertical; min-height: 58px; line-height: 1.5; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; transition: all var(--t); white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(99,102,241,0.3); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }
    .btn-sm { padding: 5px 11px; font-size: 0.77rem; border-radius: 6px; }
    .btn-danger { background: var(--danger-light); color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }

    /* ── Type tabs ── */
    .type-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .type-tab {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--card); font-size: 0.8rem; font-weight: 500; cursor: pointer;
      transition: all var(--t); color: var(--text-muted);
    }
    .type-tab:hover { border-color: #c7cdd8; color: var(--text); }
    .type-tab.active-none  { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .type-tab.active-daily { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
    .type-tab.active-weekly { background: var(--purple-light); border-color: var(--purple); color: var(--purple); }
    .type-tab.active-biweekly { background: var(--pink-light); border-color: var(--pink); color: var(--pink); }
    .type-tab.active-monthly { background: var(--orange-light); border-color: var(--orange); color: var(--orange); }

    /* ── Search ── */
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 14px; pointer-events: none; }
    #search-input {
      width: 100%; padding: 9px 36px 9px 34px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: 0.875rem;
      transition: border-color var(--t), box-shadow var(--t); background: var(--card);
    }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .search-clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 13px;
      color: var(--text-muted); padding: 3px 5px; border-radius: 4px; display: none;
    }
    .search-clear:hover { background: var(--bg); }

    /* ── Filters ── */
    .filters { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--card); font-size: 0.78rem; cursor: pointer;
      transition: all var(--t); color: var(--text-muted); font-weight: 500;
    }
    .filter-btn:hover { border-color: #c7cdd8; color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(99,102,241,0.25); }
    .filters-right { margin-left: auto; }
    .sort-select { border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 0.78rem; color: var(--text-muted); background: var(--card); cursor: pointer; }

    /* ── Section headers ── */
    .section-header { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; }
    .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .section-title.daily   { color: var(--teal); }
    .section-title.weekly  { color: var(--purple); }
    .section-title.biweekly { color: var(--pink); }
    .section-title.monthly { color: var(--orange); }
    .section-title.independent { color: var(--text-muted); }
    .section-line { flex: 1; height: 1px; background: var(--border); }
    .section-count { font-size: 0.69rem; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; font-weight: 500; }

    /* ── Task cards ── */
    .task-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
    .task-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 13px 15px; box-shadow: var(--shadow-sm);
      display: flex; align-items: flex-start; gap: 12px;
      transition: box-shadow var(--t), border-color var(--t), transform var(--t);
      animation: slideUp 0.2s ease both;
    }
    .task-card:hover { box-shadow: var(--shadow); border-color: #d0d5de; transform: translateY(-1px); }
    .task-card:hover .task-actions { opacity: 1; }
    .task-card:focus-within .task-actions { opacity: 1; }
    .task-card.done-card   { opacity: 0.48; }
    .task-card.overdue-card { border-left: 3px solid var(--danger); }
    .task-card.today-card  { border-left: 3px solid var(--warn); }
    .task-card.daily-card  { border-left: 3px solid var(--teal); }
    .task-card.weekly-card { border-left: 3px solid var(--purple); }
    .task-card.biweekly-card { border-left: 3px solid var(--pink); }
    .task-card.monthly-card { border-left: 3px solid var(--orange); }
    .task-card.paused-card { opacity: 0.42; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Check circle */
    .task-check {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--t);
    }
    .task-check:hover { border-color: var(--success); background: var(--success-light); transform: scale(1.12); }
    .task-check.checked { background: var(--success); border-color: var(--success); animation: checkPop 0.25s ease; }
    .task-check.checked::after { content: "✓"; color: white; font-size: 12px; font-weight: 700; }
    .task-check.in-progress { background: var(--accent-light); border-color: var(--accent); }
    .task-check.in-progress::after { content: "▶"; color: var(--accent); font-size: 9px; }
    .task-check.daily   { border-color: var(--teal); }
    .task-check.daily:hover   { background: var(--teal-light); border-color: var(--teal); }
    .task-check.weekly  { border-color: var(--purple); }
    .task-check.weekly:hover  { background: var(--purple-light); }
    .task-check.biweekly { border-color: var(--pink); }
    .task-check.biweekly:hover { background: var(--pink-light); }
    .task-check.monthly { border-color: var(--orange); }
    .task-check.monthly:hover { background: var(--orange-light); }
    @keyframes checkPop { 0%{transform:scale(1)} 45%{transform:scale(1.3)} 100%{transform:scale(1)} }

    .task-body { flex: 1; min-width: 0; }
    .task-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-name-text { font-size: 0.92rem; font-weight: 500; line-height: 1.4; }
    .task-name-text.done-text { text-decoration: line-through; color: var(--text-muted); }

    /* Badges */
    .badge { font-size: 0.66rem; font-weight: 600; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
    .badge-high    { background: #fee2e2; color: #b91c1c; }
    .badge-medium  { background: #fef3c7; color: #92400e; }
    .badge-low     { background: #d1fae5; color: #065f46; }
    .badge-overdue { background: #fee2e2; color: var(--danger); }
    .badge-today   { background: var(--warn-light); color: #b45309; }
    .badge-daily   { background: var(--teal-light); color: var(--teal); }
    .badge-weekly  { background: var(--purple-light); color: var(--purple); }
    .badge-biweekly { background: var(--pink-light); color: var(--pink); }
    .badge-monthly { background: var(--orange-light); color: var(--orange); }
    .badge-logged  { background: var(--success-light); color: var(--success); animation: badgePop 0.3s ease; }
    .badge-paused  { background: #f3f4f6; color: #6b7280; }
    .badge-subs    { background: var(--accent-light); color: var(--accent); }
    @keyframes badgePop { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }

    .task-meta { display: flex; gap: 7px; margin-top: 3px; align-items: center; flex-wrap: wrap; }
    .task-due { font-size: 0.74rem; color: var(--text-muted); }
    .task-due.overdue { color: var(--danger); font-weight: 600; }
    .task-due.today   { color: var(--warn);   font-weight: 600; }
    .task-last { font-size: 0.72rem; color: var(--text-light); font-style: italic; }
    .task-time { font-size: 0.74rem; color: var(--accent); font-weight: 600; }
    .task-end { font-size: 0.7rem; color: var(--text-light); font-style: italic; }
    .task-end.expired { color: var(--danger); font-weight: 600; }
    .task-notes { font-size: 0.78rem; color: var(--text-muted); margin-top: 5px; white-space: pre-wrap; line-height: 1.55; }

    .status-cycle {
      font-size: 0.7rem; color: var(--text-muted); cursor: pointer;
      padding: 2px 8px; border-radius: 10px; border: 1.5px solid var(--border);
      white-space: nowrap; transition: all var(--t); font-weight: 500;
    }
    .status-cycle:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

    /* Actions — fade in on hover */
    .task-actions { display: flex; gap: 5px; margin-left: auto; flex-shrink: 0; opacity: 0; transition: opacity var(--t); }
    .btn-pause  { background: #f3f4f6; color: #6b7280; border: 1px solid var(--border); }
    .btn-pause:hover  { background: #e5e7eb; }
    .btn-resume { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent); }
    .btn-resume:hover { background: #dde4fd; }
    .btn-defer { background: var(--warn-light); color: #b45309; border: 1px solid #fcd34d; }
    .btn-defer:hover { background: #fef3c7; }

    /* Edit form */
    .edit-form { margin-top: 10px; background: var(--bg); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
    .edit-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

    /* Subtasks */
    .subtasks { margin-top: 9px; }
    .subtask-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
    .subtask-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .subtask-cb {
      width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border);
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .subtask-cb:hover { border-color: var(--success); background: var(--success-light); }
    .subtask-cb.sub-done { background: var(--success); border-color: var(--success); animation: checkPop 0.2s ease; }
    .subtask-cb.sub-done::after { content: "✓"; color: white; font-size: 9px; font-weight: 700; }
    .subtask-name { flex: 1; color: var(--text); line-height: 1.4; }
    .subtask-name.sub-done { text-decoration: line-through; color: var(--text-muted); }
    .subtask-del { background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 11px; padding: 0 3px; opacity: 0; transition: opacity 0.12s; }
    .subtask-item:hover .subtask-del { opacity: 1; }
    .sub-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .sub-bar-track { width: 90px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .sub-bar-fill { height: 100%; background: linear-gradient(90deg, var(--success), #34d399); border-radius: 2px; transition: width 0.4s ease; }
    .sub-bar-label { font-size: 0.69rem; color: var(--text-muted); }
    .subtask-add-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .subtask-add-btn { font-size: 0.75rem; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 500; padding: 2px 0; transition: color var(--t); }
    .subtask-add-btn:hover { color: var(--accent-hover); text-decoration: underline; }
    .subtask-input { flex: 1; padding: 5px 9px; font-size: 0.8rem; border: 1.5px solid var(--border); border-radius: 6px; min-width: 0; }
    .subtask-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }

    /* ── Confirm bar ── */
    .confirm-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; padding: 10px 12px;
      background: var(--warn-light); border: 1px solid #fcd34d;
      border-radius: 8px; font-size: 0.82rem;
      animation: slideUp 0.15s ease;
    }
    .confirm-bar span { flex: 1; color: var(--text); }

    /* ── Undo toast ── */
    #undo-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: white;
      display: flex; align-items: center; gap: 12px;
      padding: 13px 18px; border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.22);
      font-size: 0.85rem; z-index: 999; min-width: 280px;
      animation: toastIn 0.22s ease;
      overflow: hidden;
    }
    #undo-toast .toast-msg { flex: 1; }
    #undo-toast .toast-undo {
      background: white; color: #1f2937; border: none;
      padding: 5px 13px; border-radius: 6px; font-weight: 700;
      cursor: pointer; font-size: 0.8rem; white-space: nowrap;
      transition: background 0.15s;
    }
    #undo-toast .toast-undo:hover { background: #e5e7eb; }
    .toast-bar {
      position: absolute; bottom: 0; left: 0;
      height: 3px; width: 100%; background: rgba(255,255,255,0.3);
      border-radius: 0 0 12px 12px;
      transition: width 5s linear;
    }
    @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform: translateX(-50%) translateY(12px); } }
    .toast-leaving { animation: toastOut 0.25s ease forwards; }

    /* ── Agenda strip ── */
    .agenda-strip {
      background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 100%);
      border: 1px solid #ddd6fe;
      border-radius: var(--radius);
      padding: 11px 16px;
      margin-bottom: 16px;
      display: none;
    }
    .agenda-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    .agenda-date { font-size: 0.8rem; font-weight: 700; color: var(--accent); }

<script>
let tasks = [];
let filter = 'bydate';
let secret = '';
let newTaskType = 'none';
let saveTimer = null;
let searchQuery = '';
const priorityOrder = { high: 0, medium: 1, low: 2 };

// --- Auth ---
async function tryAuth() {
  const val = document.getElementById('auth-input').value.trim();
  if (!val) return;
  setSyncState('syncing', 'Checking…');
  try {
    const res = await fetch('/api/tasks', { headers: { 'x-tasks-secret': val } });
    if (res.status === 401) {
      document.getElementById('auth-error').textContent = 'Invalid access key.';
      setSyncState('error', 'Auth failed');
      return;
    }
    tasks = await res.json();
    secret = val;
    localStorage.setItem('tasks_secret', val);
    autoAdvanceRecurring(); // fix stale due dates before first render
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    setSyncState('ok', 'Synced');
    render();
    loadCalendar();
  } catch(e) {
    document.getElementById('auth-error').textContent = 'Could not connect.';
    setSyncState('error', 'Error');
  }
}
document.getElementById('auth-input').addEventListener('keydown', e => { if(e.key==='Enter') tryAuth(); });

(async function autoLogin() {
  const params = new URLSearchParams(location.search);
  const p = params.get('key');
  if (p) { localStorage.setItem('tasks_secret', p); history.replaceState({}, '', location.pathname); }
  const saved = p || localStorage.getItem('tasks_secret');
  if (saved) { document.getElementById('auth-input').value = saved; await tryAuth(); }
})();

// --- Sync ---
function setSyncState(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (!dot) return;
  dot.className = 'sync-dot' + (state==='syncing'?' syncing':state==='error'?' error':'');
  lbl.textContent = label;
}
async function saveTasks() {
  setSyncState('syncing', 'Saving…');
  try {
    await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-tasks-secret': secret },
      body: JSON.stringify(tasks)
    });
    setSyncState('ok', 'Synced');
  } catch(e) { setSyncState('error', 'Save failed'); }
}
function debouncedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveTasks, 600); }

// --- Type selector ---
function selectType(type, btn) {
  newTaskType = type;
  document.querySelectorAll('.type-tab').forEach(b => b.className = 'type-tab');
  btn.className = 'type-tab active-' + type;
  document.getElementById('due-group').style.display = type === 'none' ? '' : 'none';
  document.getElementById('daily-options-group').style.display = type === 'daily' ? '' : 'none';
  document.getElementById('weekday-group').style.display = type === 'weekly' ? '' : 'none';
  document.getElementById('monthday-group').style.display = type === 'monthly' ? '' : 'none';
  document.getElementById('biweekly-date-group').style.display = type === 'biweekly' ? '' : 'none';
  document.getElementById('enddate-group').style.display = type === 'none' ? 'none' : '';
}

// --- Date helpers ---
function today() {
  // Before 5am ET, treat it as still being the previous day
  const etStr = new Date().toLocaleString('en-US', { timeZone: 'America/New_York' });
  const et = new Date(etStr);
  if (et.getHours() < 5) et.setDate(et.getDate() - 1);
  const y = et.getFullYear();
  const m = String(et.getMonth() + 1).padStart(2, '0');
  const d = String(et.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function isOverdue(t)  { return t.recurrence==='none' && t.due && t.due < today() && t.status !== 'done'; }
function isDueToday(t) { return t.recurrence==='none' && t.due && t.due === today() && t.status !== 'done'; }
function isExpired(t)  { return t.recurrence !== 'none' && !!t.endDate && t.endDate < today(); }

// Does task t land on calendar date dateStr ("YYYY-MM-DD")? Pure calendar math off the
// task's recurrence rule (weekDay/monthDay/anchor) — independent of the single mutable
// `due` field, so past/future months render correctly regardless of what's been logged.
function occursOn(t, dateStr) {
  if (t.paused || isExpired(t)) return false;
  if (t.recurrence === 'none') return t.status !== 'done' && t.due === dateStr;
  if (t.created && dateStr < t.created.slice(0, 10)) return false;
  if (t.endDate && dateStr > t.endDate) return false;
  const d = new Date(dateStr + 'T12:00:00');
  if (t.recurrence === 'daily') {
    if (t.dailyType === 'weekdays') { const wd = d.getDay(); return wd !== 0 && wd !== 6; }
    return true;
  }
  if (t.recurrence === 'weekly') return t.weekDay != null && d.getDay() === parseInt(t.weekDay);
  if (t.recurrence === 'biweekly') {
    if (!t.anchor) return false;
    const diffDays = Math.round((d - new Date(t.anchor + 'T12:00:00')) / 86400000);
    return diffDays >= 0 && diffDays % 14 === 0;
  }
  if (t.recurrence === 'monthly') {
    if (t.monthDay == null) return false;
    const md = parseInt(t.monthDay);
    if (md === 0) return d.getDate() === new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === md;
  }
  return false;
}

function relativeDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const base = new Date(today() + 'T00:00:00'); // ET-aware today
  const diff = Math.round((d - base) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return `In ${diff} days`;
  if (diff < -1 && diff > -7) return `${Math.abs(diff)} days ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function nextDueDate(recurrence, weekDay, monthDay, dailyType, anchor) {
  // Biweekly is anchor-based (always a multiple of 14 days from the original
  // first-occurrence date) so it self-corrects and never drifts off its weekday,
  // no matter when it actually gets logged or re-opened.
  if (recurrence === 'biweekly') {
    const a = new Date((anchor || today()) + 'T00:00:00');
    const base = new Date(today() + 'T00:00:00');
    const diffDays = Math.round((base - a) / 86400000);
    let periods = diffDays < 0 ? 0 : Math.floor(diffDays / 14) + 1;
    const next = new Date(a);
    next.setDate(next.getDate() + periods * 14);
    const y = next.getFullYear();
    const m = String(next.getMonth() + 1).padStart(2, '0');
    const dd = String(next.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  // Start from ET-aware today at noon — avoids toISOString() UTC date shift
  const d = new Date(today() + 'T12:00:00');
  if (recurrence === 'daily') {
    d.setDate(d.getDate() + 1);
    if (dailyType === 'weekdays') {
      const day = d.getDay();
      if (day === 6) d.setDate(d.getDate() + 2);
      else if (day === 0) d.setDate(d.getDate() + 1);
    }
  } else if (recurrence === 'weekly') {
    if (weekDay !== null && weekDay !== undefined) {
      const cur = d.getDay();
      let diff = (parseInt(weekDay) - cur + 7) % 7;
      if (diff === 0) diff = 7;
      d.setDate(d.getDate() + diff);
    } else { d.setDate(d.getDate() + 7); }
  } else if (recurrence === 'monthly') {
    if (monthDay !== null && monthDay !== undefined) {
      const md = parseInt(monthDay);
      if (md === 0) { d.setDate(1); d.setMonth(d.getMonth() + 2); d.setDate(0); }
      else { d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(md); }
    } else { d.setMonth(d.getMonth() + 1); }
  }
  // Return local date components (no toISOString to avoid UTC shift)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function ordinal(n) {
  if (n === 0) return 'last day';
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  const base = new Date(today() + 'T00:00:00'); // ET-aware today
  const diff = Math.floor((base - new Date(dateStr + 'T00:00:00')) / 86400000);
  if (diff === 0) return 'today';
  if (diff === 1) return 'yesterday';
  return diff + ' days ago';
}

// Auto-advance recurring tasks whose due dates are stale (past) — sets them to today
// so they show in the "Today" section rather than accumulating as fake-overdue
function autoAdvanceRecurring() {
  const todayStr = today();
  let changed = false;
  tasks.forEach(t => {
    if (t.recurrence === 'none' || t.paused || !t.due) return;
    if (t.due < todayStr) {
      t.due = todayStr; // reset to today; advances to next occurrence when user logs it
      changed = true;
    }
  });
  if (changed) debouncedSave();
}

// --- Task CRUD ---
function addTask() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { document.getElementById('new-name').focus(); return; }
  let weekDay  = newTaskType === 'weekly'  ? parseInt(document.getElementById('new-weekday').value)  : null;
  const monthDay = newTaskType === 'monthly' ? parseInt(document.getElementById('new-monthday').value) : null;
  const dailyType = newTaskType === 'daily'  ? document.getElementById('new-daily-type').value : null;
  let anchor = null, initialDue;
  if (newTaskType === 'none') {
    initialDue = document.getElementById('new-due').value || null;
  } else if (newTaskType === 'biweekly') {
    anchor = document.getElementById('new-biweekly-date').value || today();
    initialDue = anchor;
    weekDay = new Date(anchor + 'T12:00:00').getDay();
  } else {
    initialDue = nextDueDate(newTaskType, weekDay, monthDay, dailyType);
  }
  const suggestedTime = document.getElementById('new-time').value.trim() || null;
  const pingTime = document.getElementById('new-pingtime').value || null;
  const endDate = newTaskType === 'none' ? null : (document.getElementById('new-enddate').value || null);
  tasks.unshift({
    id: Date.now().toString(), name,
    due: initialDue,
    priority: document.getElementById('new-priority').value,
    notes: document.getElementById('new-notes').value.replace(/\r\n/g,'\n').trim() || null,
    status: 'todo', recurrence: newTaskType,
    weekDay, monthDay, dailyType, anchor,
    suggestedTime, pingTime, endDate,
    lastCompleted: null, subtasks: [],
    created: new Date().toISOString()
  });
  document.getElementById('new-name').value = '';
  document.getElementById('new-due').value = '';
  document.getElementById('new-biweekly-date').value = '';
  document.getElementById('new-time').value = '';
  document.getElementById('new-pingtime').value = '';
  document.getElementById('new-enddate').value = '';
  document.getElementById('new-priority').value = 'medium';
  document.getElementById('new-notes').value = '';
  debouncedSave(); render();
  document.getElementById('new-name').focus();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  debouncedSave(); render();
}

// --- One-click import of the standard Tenkara work schedule ---
// Anchor dates for the two biweekly inbox cleanups are fixed calendar dates so they
// never land on the same day (Vita = Wednesdays, NutriPro = Fridays, forever).
const WORK_TASK_DEFAULTS = [
  { name: 'Platform checks', recurrence: 'daily', dailyType: 'everyday', suggestedTime: '11:00–11:15 AM ET', pingTime: '11:00', priority: 'medium' },
  { name: 'Slack channel check (urgent items)', recurrence: 'daily', dailyType: 'everyday', suggestedTime: '11:15–11:30 AM ET', pingTime: '11:15', priority: 'medium' },
  { name: 'Checkin: Material & order updates in the platform', recurrence: 'daily', dailyType: 'everyday', suggestedTime: '11:30–11:45 AM ET', pingTime: '11:30', priority: 'medium' },
  { name: 'Reviewing Suppliers and Quotes in the platform', recurrence: 'daily', dailyType: 'everyday', suggestedTime: '11:45 AM–1:30 PM ET', pingTime: '11:45', priority: 'medium' },
  { name: 'Agents Testing', recurrence: 'daily', dailyType: 'everyday', suggestedTime: '1:30–5:30 PM ET', pingTime: '13:30', endDate: '2026-07-31', priority: 'high', notes: 'Daily through end of July 2026 (this month only) — revisit whether to continue after that.' },
  { name: 'Gather channel updates and consolidate on file', recurrence: 'weekly', weekDay: 1, suggestedTime: '11:15–11:45 AM ET', pingTime: '11:15', priority: 'medium', notes: 'Mondays.' },
  { name: 'EOD reports checking', recurrence: 'weekly', weekDay: 1, suggestedTime: '5:00–5:30 PM ET', pingTime: '17:00', priority: 'medium', notes: 'Mondays.' },
  { name: 'Tenkara Inbox bug logs and overall checks', recurrence: 'weekly', weekDay: 2, suggestedTime: '4:30 PM ET', pingTime: '16:30', priority: 'medium', notes: 'Tuesdays.' },
  { name: 'Tenkara Inbox - Quo Flow Updates', recurrence: 'weekly', weekDay: 4, suggestedTime: '11:30 AM–12:00 PM ET', pingTime: '11:30', priority: 'medium', notes: 'Thursdays.' },
  { name: 'Tenkara Inbox cleanup (Vita Organica)', recurrence: 'biweekly', anchor: '2026-07-15', suggestedTime: '12:00–12:30 PM ET', pingTime: '12:00', priority: 'medium', notes: 'Every other Wednesday — offset from NutriPro so they never land on the same day.' },
  { name: 'Tenkara Inbox cleanup (NutriPro)', recurrence: 'biweekly', anchor: '2026-07-17', suggestedTime: '12:00–12:30 PM ET', pingTime: '12:00', priority: 'medium', notes: 'Every other Friday — offset from Vita Organica so they never land on the same day.' },
  { name: 'Quo/Calls Management cleanup', recurrence: 'monthly', monthDay: 10, suggestedTime: '2:00–2:30 PM ET', pingTime: '14:00', priority: 'medium', notes: '10th of every month.' },
  { name: 'Drive Organization / cleanup', recurrence: 'monthly', monthDay: 15, suggestedTime: '2:00–2:30 PM ET', pingTime: '14:00', priority: 'medium', notes: '15th of every month.' },
];

function importWorkTasks() {
  let added = 0;
  WORK_TASK_DEFAULTS.forEach(d => {
    if (tasks.some(t => t.name === d.name)) return; // dedupe by name — safe to click again later
    let due, weekDay = d.weekDay ?? null;
    if (d.recurrence === 'daily') due = nextDueDate('daily', null, null, d.dailyType);
    else if (d.recurrence === 'weekly') due = nextDueDate('weekly', d.weekDay, null, null);
    else if (d.recurrence === 'monthly') due = nextDueDate('monthly', null, d.monthDay, null);
    else if (d.recurrence === 'biweekly') { due = d.anchor; weekDay = new Date(d.anchor + 'T12:00:00').getDay(); }
    tasks.unshift({
      id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
      name: d.name, due, priority: d.priority || 'medium',
      notes: d.notes || null, status: 'todo', recurrence: d.recurrence,
      weekDay, monthDay: d.monthDay ?? null, dailyType: d.dailyType ?? null,
      anchor: d.recurrence === 'biweekly' ? d.anchor : null,
      suggestedTime: d.suggestedTime || null, pingTime: d.pingTime || null, endDate: d.endDate || null,
      lastCompleted: null, subtasks: [], created: new Date().toISOString()
    });
    added++;
  });
  if (added > 0) { debouncedSave(); render(); }
  alert(added > 0 ? `Imported ${added} task${added !== 1 ? 's' : ''} into your tracker.` : 'All work tasks already exist — nothing to import.');
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (t.recurrence !== 'none') {
    // Show inline confirm instead of immediately logging
    showRecurringConfirm(id);
    return;
  }
  t.status = t.status === 'done' ? 'todo' : 'done';
  debouncedSave();
  render();
}

function showRecurringConfirm(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  // Remove any existing confirm bars
  document.querySelectorAll('.confirm-bar').forEach(el => el.remove());
  const card = document.querySelector(`[data-id="${id}"]`);
  if (!card) return;
  const bar = document.createElement('div');
  bar.className = 'confirm-bar';
  bar.innerHTML = `
    <span>Log <strong>${esc(t.name)}</strong> as done today?</span>
    <button class="btn btn-primary btn-sm" onclick="confirmDone('${id}')">✓ Yes, log it</button>
    <button class="btn btn-ghost btn-sm" onclick="cancelConfirm()">Cancel</button>
  `;
  card.appendChild(bar);
}

function cancelConfirm() {
  document.querySelectorAll('.confirm-bar').forEach(el => el.remove());
}

let undoTimer = null;
let undoSnap  = null; // stores { id, snap } for undo — avoids JSON-in-onclick fragility

function confirmDone(id) {
  cancelConfirm();
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  // Snapshot for undo
  const snap = { due: t.due, lastCompleted: t.lastCompleted, status: t.status };
  // Log completion
  t.lastCompleted = today();
  t.status = 'todo';
  t.due = nextDueDate(t.recurrence, t.weekDay, t.monthDay, t.dailyType, t.anchor);
  debouncedSave();
  updateStats();
  showUndoToast(id, snap, t.name, 'logged');
}

// Push a recurring task to its next occurrence WITHOUT marking it completed —
// for "didn't get to it, don't want to falsely log it as done" days. Doesn't
// touch lastCompleted/status, so it won't show up as a false positive in any
// completion history/export.
function deferTask(id) {
  cancelConfirm();
  const t = tasks.find(t => t.id === id);
  if (!t || t.recurrence === 'none') return;
  const snap = { due: t.due, lastCompleted: t.lastCompleted, status: t.status };
  t.due = nextDueDate(t.recurrence, t.weekDay, t.monthDay, t.dailyType, t.anchor);
  debouncedSave();
  updateStats();
  showUndoToast(id, snap, t.name, 'deferred to next occurrence');
}

function showUndoToast(id, snap, name, label) {
  const existing = document.getElementById('undo-toast');
  if (existing) existing.remove();
  if (undoTimer) clearTimeout(undoTimer);
  undoSnap = { id, snap }; // stored at module level — no JSON-in-onclick needed

  const toast = document.createElement('div');
  toast.id = 'undo-toast';
  toast.innerHTML = `
    <span class="toast-msg">✓ <strong>${esc(name)}</strong> ${label || 'logged'}</span>
    <button class="toast-undo" onclick="undoDone()">Undo</button>
    <div class="toast-bar" id="toast-bar"></div>
  `;
  document.body.appendChild(toast);
  // Animate progress bar shrinking
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const bar = document.getElementById('toast-bar');
      if (bar) bar.style.width = '0%';
    });
  });
  undoTimer = setTimeout(() => {
    toast.classList.add('toast-leaving');
    undoSnap = null;
    setTimeout(() => toast.remove(), 280);
  }, 5000);
}

function undoDone() {
  if (!undoSnap) return;
  const { id, snap } = undoSnap;
  undoSnap = null;
  if (undoTimer) clearTimeout(undoTimer);
  const toast = document.getElementById('undo-toast');
  if (toast) { toast.classList.add('toast-leaving'); setTimeout(() => toast.remove(), 280); }
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.due = snap.due || null;
  t.lastCompleted = snap.lastCompleted || null;
  t.status = snap.status || 'todo';
  debouncedSave();
  render();
}

function pauseTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.paused = !t.paused;
  debouncedSave(); render();
}

function cycleStatus(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (t.recurrence !== 'none') {
    t.status = t.status === 'in-progress' ? 'todo' : 'in-progress';
  } else {
    const cycle = ['todo','in-progress','done'];
    t.status = cycle[(cycle.indexOf(t.status) + 1) % cycle.length];
  }
  debouncedSave(); render();
}

function startEdit(id) {
  document.querySelectorAll('.edit-form').forEach(el => el.remove());
  document.querySelectorAll('[data-edit-id]').forEach(el => el.textContent = 'Edit');
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  const card = document.querySelector(`[data-id="${id}"]`);
  const isRecurring = t.recurrence !== 'none';
  const form = document.createElement('div');
  form.className = 'edit-form';
  form.innerHTML = `
    <div class="edit-row">
      <div class="form-group" style="flex:1;min-width:150px"><label>Name</label><input type="text" id="en-${id}" value="${esc(t.name)}" /></div>
      ${!isRecurring ? `<div class="form-group"><label>Due date</label><input type="date" id="ed-${id}" value="${t.due||''}" /></div>` : ''}
      <div class="form-group"><label>Suggested time</label><input type="text" id="et-${id}" value="${esc(t.suggestedTime||'')}" placeholder="e.g. 11:00–11:15 AM ET" style="width:150px" /></div>
      <div class="form-group"><label>Slack ping at (ET)</label><input type="time" id="epn-${id}" value="${t.pingTime||''}" /></div>
      ${isRecurring ? `<div class="form-group"><label>End date</label><input type="date" id="ee-${id}" value="${t.endDate||''}" /></div>` : ''}
      <div class="form-group"><label>Priority</label>
        <select id="ep-${id}">
          <option value="high" ${t.priority==='high'?'selected':''}>High</option>
          <option value="medium" ${t.priority==='medium'?'selected':''}>Medium</option>
          <option value="low" ${t.priority==='low'?'selected':''}>Low</option>
        </select>
      </div>
    </div>
    <div class="edit-row">
      <div class="form-group" style="flex:1"><label>Notes</label><textarea id="eno-${id}">${esc(t.notes||'')}</textarea></div>
      <button class="btn btn-primary btn-sm" onclick="saveEdit('${id}')">Save</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">Cancel</button>
    </div>`;
  card.appendChild(form);
  document.querySelector(`[data-edit-id="${id}"]`).textContent = 'Cancel';
  document.getElementById(`en-${id}`).focus();
}

function cancelEdit() {
  document.querySelectorAll('.edit-form').forEach(el => el.remove());
  document.querySelectorAll('[data-edit-id]').forEach(el => el.textContent = 'Edit');
}

function saveEdit(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.name = document.getElementById(`en-${id}`).value.trim() || t.name;
  if (t.recurrence === 'none' && document.getElementById(`ed-${id}`)) t.due = document.getElementById(`ed-${id}`).value || null;
  if (t.recurrence !== 'none' && document.getElementById(`ee-${id}`)) t.endDate = document.getElementById(`ee-${id}`).value || null;
  t.suggestedTime = document.getElementById(`et-${id}`).value.trim() || null;
  t.pingTime = document.getElementById(`epn-${id}`).value || null;
  t.priority = document.getElementById(`ep-${id}`).value;
  t.notes = document.getElementById(`eno-${id}`).value.trim() || null;
  debouncedSave(); render();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// --- Search & Filter ---
function onSearch() {
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  render();
}
function clearSearch() {
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}
function matchesSearch(t) {
  if (!searchQuery) return true;
  if ((t.name||'').toLowerCase().includes(searchQuery)) return true;
  if ((t.notes||'').toLowerCase().includes(searchQuery)) return true;
  if ((t.subtasks||[]).some(s => s.name.toLowerCase().includes(searchQuery))) return true;
  return false;
}
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function getSorted(arr) {
  const sort = document.getElementById('sort-select')?.value || 'due';
  return [...arr].sort((a,b) => {
    if (sort === 'priority') return (priorityOrder[a.priority]||1)-(priorityOrder[b.priority]||1);
    if (sort === 'due') {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1; if (!b.due) return -1;
      return a.due.localeCompare(b.due);
    }
    return new Date(b.created)-new Date(a.created);
  });
}
function getFiltered() {
  let arr = tasks.filter(matchesSearch);
  if (filter === 'one-time') arr = arr.filter(t => t.recurrence === 'none');
  else if (filter === 'daily')   arr = arr.filter(t => t.recurrence === 'daily');
  else if (filter === 'weekly')  arr = arr.filter(t => t.recurrence === 'weekly');
  else if (filter === 'biweekly') arr = arr.filter(t => t.recurrence === 'biweekly');
  else if (filter === 'monthly') arr = arr.filter(t => t.recurrence === 'monthly');
  else if (filter === 'overdue') arr = arr.filter(t => isOverdue(t));
  else if (filter === 'done')   arr = arr.filter(t => t.status === 'done');
  else if (filter === 'paused') arr = arr.filter(t => !!t.paused);
  return getSorted(arr);
}

// --- Subtasks ---
function renderSubtasks(t) {
  const subs = t.subtasks || [];
  const done = subs.filter(s => s.done).length;
  let html = `<div class="subtasks" id="subtasks-${t.id}">`;
  if (subs.length > 0) {
    html += `<div class="subtask-list">`;
    subs.forEach(s => {
      html += `<div class="subtask-item">
        <div class="subtask-cb ${s.done?'sub-done':''}" onclick="toggleSubtask('${t.id}','${s.id}')"></div>
        <span class="subtask-name ${s.done?'sub-done':''}">${esc(s.name)}</span>
        <button class="subtask-del" onclick="deleteSubtask('${t.id}','${s.id}')" title="Remove">✕</button>
      </div>`;
    });
    html += `</div>`;
    const pct = Math.round((done / subs.length) * 100);
    html += `<div class="sub-bar-wrap">
      <div class="sub-bar-track"><div class="sub-bar-fill" style="width:${pct}%"></div></div>
      <span class="sub-bar-label">${done}/${subs.length} done</span>
    </div>`;
  }
  html += `<div class="subtask-add-row" id="subtask-add-row-${t.id}">
    <button class="subtask-add-btn" onclick="showAddSubtask('${t.id}')">+ Add subtask</button>
  </div></div>`;
  return html;
}

function showAddSubtask(taskId) {
  const row = document.getElementById(`subtask-add-row-${taskId}`);
  if (!row) return;
  row.innerHTML = `
    <input class="subtask-input" id="sub-input-${taskId}" placeholder="Subtask name…"
      onkeydown="if(event.key==='Enter')saveSubtask('${taskId}');if(event.key==='Escape')cancelSubtask('${taskId}')" />
    <button class="btn btn-primary btn-sm" style="padding:4px 10px;font-size:0.75rem" onclick="saveSubtask('${taskId}')">Add</button>
    <button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:0.75rem" onclick="cancelSubtask('${taskId}')">✕</button>`;
  document.getElementById(`sub-input-${taskId}`)?.focus();
}
function cancelSubtask(taskId) {
  const row = document.getElementById(`subtask-add-row-${taskId}`);
  if (row) row.innerHTML = `<button class="subtask-add-btn" onclick="showAddSubtask('${taskId}')">+ Add subtask</button>`;
}
function saveSubtask(taskId) {
  const input = document.getElementById(`sub-input-${taskId}`);
  if (!input) return;
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const t = tasks.find(t => t.id === taskId);
  if (!t) return;
  if (!t.subtasks) t.subtasks = [];
  t.subtasks.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), name, done: false });
  debouncedSave(); render();
}
function toggleSubtask(taskId, subId) {
  const t = tasks.find(t => t.id === taskId);
  if (!t || !t.subtasks) return;
  const s = t.subtasks.find(s => s.id === subId);
  if (s) s.done = !s.done;
  debouncedSave(); render();
}
function deleteSubtask(taskId, subId) {
  const t = tasks.find(t => t.id === taskId);
  if (!t || !t.subtasks) return;
  t.subtasks = t.subtasks.filter(s => s.id !== subId);
  debouncedSave(); render();
}

// --- Render ---
function renderTask(t) {
  const overdue = isOverdue(t), dueToday = isDueToday(t);
  const isDone = t.status === 'done', rec = t.recurrence, isPaused = !!t.paused;
  const expired = isExpired(t);

  let cardClass = 'task-card';
  if (isPaused || expired) cardClass += ' paused-card';
  else if (isDone) cardClass += ' done-card';
  else if (overdue) cardClass += ' overdue-card';
  else if (dueToday) cardClass += ' today-card';
  else if (rec === 'daily') cardClass += ' daily-card';
  else if (rec === 'weekly') cardClass += ' weekly-card';
  else if (rec === 'biweekly') cardClass += ' biweekly-card';
  else if (rec === 'monthly') cardClass += ' monthly-card';

  let checkClass = 'task-check';
  if (isDone) checkClass += ' checked';
  else if (t.status === 'in-progress') checkClass += ' in-progress';
  else if (rec !== 'none') checkClass += ' ' + rec;

  let dueText = '', dueClass = 'task-due';
  if (t.due && rec === 'none') {
    const rel = relativeDate(t.due);
    if (overdue) { dueText = `⚠ ${rel}`; dueClass += ' overdue'; }
    else if (dueToday) { dueText = `📍 ${rel}`; dueClass += ' today'; }
    else dueText = `📅 ${rel}`;
  } else if (rec !== 'none') {
    let sched = '';
    if (rec === 'daily') sched = t.dailyType === 'weekdays' ? 'Weekdays only' : 'Every day';
    else if (rec === 'weekly' && t.weekDay != null) sched = `Every ${DAY_NAMES[t.weekDay]}`;
    else if (rec === 'biweekly' && t.weekDay != null) sched = `Every other ${DAY_NAMES[t.weekDay]}`;
    else if (rec === 'monthly' && t.monthDay != null) sched = `Every ${ordinal(t.monthDay)}`;
    const fmt = t.due ? relativeDate(t.due) : null;
    dueText = [sched, fmt ? `Next: ${fmt}` : ''].filter(Boolean).join(' · ');
  }

  const lastDone = t.lastCompleted ? `Last: ${daysSince(t.lastCompleted)}` : '';
  const statusLabel = t.status==='todo'?'To Do':t.status==='in-progress'?'In Progress':'Done';
  const recBadge = rec!=='none' ? `<span class="badge badge-${rec}">${rec}</span>` : '';
  const pausedBadge = isPaused ? `<span class="badge badge-paused">⏸ Paused</span>` : '';
  const timeBadge = t.suggestedTime ? `<span class="task-time">🕐 ${esc(t.suggestedTime)}</span>` : '';
  const pingBadge = t.pingTime ? `<span class="task-time" title="Slack ping around this hour (Hobby plan can't guarantee the exact minute)">🔔 ${esc(t.pingTime)}</span>` : '';
  const endBadge = (rec !== 'none' && t.endDate)
    ? `<span class="task-end${expired ? ' expired' : ''}">${expired ? '⏳ Ended ' : 'Ends '}${t.endDate}</span>` : '';
  const disabled = isPaused || expired;
  const subs = t.subtasks || [];
  const subsBadge = subs.length > 0
    ? `<span class="badge badge-subs">${subs.filter(s=>s.done).length}/${subs.length}</span>` : '';

  return `
    <div class="${cardClass}" data-id="${t.id}">
      <div class="${checkClass}"
        onclick="${disabled ? '' : `toggleDone('${t.id}')`}"
        title="${expired ? 'Ended — edit end date to reactivate' : isPaused ? 'Paused — resume to log' : rec!=='none' ? 'Log completion' : 'Toggle done'}"
        style="${disabled ? 'cursor:not-allowed;opacity:0.4' : ''}"></div>
      <div class="task-body">
        <div class="task-title-row">
          <span class="task-name-text ${isDone?'done-text':''}">${esc(t.name)}</span>
          ${recBadge}${pausedBadge}
          <span class="badge badge-${t.priority}">${t.priority}</span>
          ${overdue&&!disabled ? '<span class="badge badge-overdue">Overdue</span>' : ''}
          ${dueToday&&!disabled ? '<span class="badge badge-today">Today</span>' : ''}
          ${subsBadge}
        </div>
        <div class="task-meta">
          ${dueText ? `<span class="${dueClass}">${dueText}</span>` : ''}
          ${timeBadge}
          ${pingBadge}
          ${endBadge}
          ${lastDone ? `<span class="task-last">${lastDone}</span>` : ''}
          ${!disabled ? `<span class="status-cycle" onclick="cycleStatus('${t.id}')">${statusLabel} →</span>` : ''}
        </div>
        ${t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : ''}
        ${renderSubtasks(t)}
      </div>
      <div class="task-actions">
        ${rec!=='none' && !disabled ? `<button class="btn btn-sm btn-defer" onclick="deferTask('${t.id}')" title="Push to the next occurrence without logging it as done">⏭ Defer</button>` : ''}
        ${rec!=='none' ? `<button class="btn btn-sm ${isPaused?'btn-resume':'btn-pause'}" onclick="pauseTask('${t.id}')">${isPaused?'▶ Resume':'⏸ Pause'}</button>` : ''}
        <button class="btn btn-sm btn-ghost" data-edit-id="${t.id}" onclick="startEdit('${t.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">✕</button>
      </div>
    </div>`;
}

function renderSection(title, colorClass, icon, arr) {
  if (!arr.length) return '';
  return `
    <div class="section-header">
      <span class="section-title ${colorClass}">${icon} ${title}</span>
      <span class="section-count">${arr.length}</span>
      <div class="section-line"></div>
    </div>
    <div class="task-list">${arr.map(renderTask).join('')}</div>`;
}

function updateStats() {
  const overdue = tasks.filter(t => isOverdue(t)).length;
  const active  = tasks.filter(t => t.status !== 'done' && !t.paused && !isExpired(t)).length;
  const oneTime = tasks.filter(t => t.recurrence === 'none');
  const done    = oneTime.filter(t => t.status === 'done').length;
  const pct     = oneTime.length ? Math.round((done / oneTime.length) * 100) : 0;
  document.getElementById('stat-overdue').textContent = overdue;
  document.getElementById('stat-active').textContent  = active;
  document.getElementById('stat-done').textContent    = done;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '%';
}

function renderByDate() {
  const todayStr = today();
  // ET-aware +7 days (no toISOString to avoid UTC date shift)
  const etStr = new Date().toLocaleString('en-US', { timeZone: 'America/New_York' });
  const et7 = new Date(etStr);
  if (et7.getHours() < 5) et7.setDate(et7.getDate() - 1);
  et7.setDate(et7.getDate() + 7);
  const in7Str = `${et7.getFullYear()}-${String(et7.getMonth()+1).padStart(2,'0')}-${String(et7.getDate()).padStart(2,'0')}`;
  const active = tasks.filter(t => t.status !== 'done' && !t.paused && !isExpired(t) && matchesSearch(t));
  // Only one-time tasks can be "overdue" — recurring tasks with past due dates go to Today
  const overdue  = getSorted(active.filter(t => t.recurrence === 'none' && t.due && t.due < todayStr));
  // Today: one-time due today + recurring tasks due today OR in the past (treat as due today)
  const dueToday = getSorted(active.filter(t => {
    if (t.recurrence === 'none') return t.due && t.due === todayStr;
    return t.due && t.due <= todayStr;
  }));
  const thisWeek = getSorted(active.filter(t => t.due && t.due > todayStr && t.due <= in7Str));
  const later    = getSorted(active.filter(t => t.due && t.due > in7Str));
  const noDate   = getSorted(active.filter(t => !t.due));
  let html = '';
  html += renderSection('Overdue', 'independent', '⚠️', overdue);
  html += renderSection('Today', 'daily', '📍', dueToday);
  html += renderSection('This Week', 'weekly', '📅', thisWeek);
  html += renderSection('Later', 'monthly', '🗓', later);
  html += renderSection('No Due Date', 'independent', '📌', noDate);
  document.getElementById('task-list-container').innerHTML = html ||
    `<div class="empty-state"><div class="emoji">✨</div><h3>All clear!</h3><p>Nothing active. Great work.</p></div>`;
}

// --- Calendar view ---
let calMonth = null;       // Date at the 1st of the currently-displayed month
let selectedCalDay = null; // "YYYY-MM-DD" currently shown in the detail panel

function startOfMonthET() {
  const [y, m] = today().split('-').map(Number);
  return new Date(y, m - 1, 1);
}

function calNavMonth(delta) {
  if (!calMonth) calMonth = startOfMonthET();
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  renderCalendar();
}
function calGoToday() { calMonth = startOfMonthET(); selectedCalDay = today(); renderCalendar(); }

function tasksOn(dateStr) {
  return tasks.filter(t => occursOn(t, dateStr))
    .sort((a, b) => (a.pingTime || a.suggestedTime || '').localeCompare(b.pingTime || b.suggestedTime || ''));
}

function selectCalDay(dateStr) {
  selectedCalDay = dateStr;
  document.querySelectorAll('.calendar-cell').forEach(el => el.classList.remove('cal-selected'));
  const cell = document.querySelector(`[data-cal-date="${dateStr}"]`);
  if (cell) cell.classList.add('cal-selected');
  renderCalDetail(dateStr);
}

function renderCalDetail(dateStr) {
  const detail = document.getElementById('calendar-detail');
  if (!detail) return;
  const dayTasks = tasksOn(dateStr);
  const label = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  if (!dayTasks.length) {
    detail.innerHTML = `<div class="cal-detail-header">${label}</div><div class="empty-state" style="padding:16px"><p>Nothing scheduled.</p></div>`;
    return;
  }
  const rows = dayTasks.map(t => {
    const recLabel = t.recurrence === 'none' ? 'onetime' : t.recurrence;
    return `<div class="cal-detail-row">
      <span class="badge badge-${recLabel}">${t.recurrence === 'none' ? 'one-time' : t.recurrence}</span>
      <span class="cal-detail-name">${esc(t.name)}</span>
      ${t.suggestedTime ? `<span class="task-time">🕐 ${esc(t.suggestedTime)}</span>` : ''}
    </div>`;
  }).join('');
  detail.innerHTML = `<div class="cal-detail-header">${label} · ${dayTasks.length} task${dayTasks.length !== 1 ? 's' : ''}</div>${rows}`;
}

function renderCalendar() {
  if (!calMonth) calMonth = startOfMonthET();
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const todayStr = today();

  let cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-daylabel">${d}</div>`).join('');

  for (let i = 0; i < startDow; i++) {
    cells += `<div class="calendar-cell other-month"><div class="cal-daynum">${prevMonthDays - startDow + 1 + i}</div></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayTasks = tasksOn(dateStr);
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalDay;
    const chips = dayTasks.slice(0, 3).map(t =>
      `<div class="cal-chip cal-chip-${t.recurrence}" title="${esc(t.name)}${t.suggestedTime ? ' — ' + esc(t.suggestedTime) : ''}">${esc(t.name)}</div>`
    ).join('');
    const more = dayTasks.length > 3 ? `<div class="cal-more">+${dayTasks.length - 3} more</div>` : '';
    cells += `<div class="calendar-cell ${isToday ? 'cal-today' : ''} ${isSelected ? 'cal-selected' : ''}" data-cal-date="${dateStr}" onclick="selectCalDay('${dateStr}')">
      <div class="cal-daynum">${day}</div>
      <div class="cal-chips">${chips}${more}</div>
    </div>`;
  }
  const totalCells = startDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    cells += `<div class="calendar-cell other-month"><div class="cal-daynum">${i}</div></div>`;
  }

  document.getElementById('calendar-container').innerHTML = `
    <div class="calendar-header">
      <button class="btn btn-ghost btn-sm" onclick="calNavMonth(-1)">‹ Prev</button>
      <span class="calendar-month-label">${monthLabel}</span>
      <button class="btn btn-ghost btn-sm" onclick="calNavMonth(1)">Next ›</button>
      <button class="btn btn-ghost btn-sm" onclick="calGoToday()">Today</button>
    </div>
    <div class="calendar-grid">${cells}</div>
    <div id="calendar-detail"></div>`;

  if (!selectedCalDay || selectedCalDay.slice(0, 7) !== `${year}-${String(month + 1).padStart(2, '0')}`) {
    selectedCalDay = (year === parseInt(todayStr.slice(0,4)) && month === parseInt(todayStr.slice(5,7))-1) ? todayStr : `${year}-${String(month+1).padStart(2,'0')}-01`;
  }
  const cell = document.querySelector(`[data-cal-date="${selectedCalDay}"]`);
  if (cell) cell.classList.add('cal-selected');
  renderCalDetail(selectedCalDay);
}

function render() {
  updateStats();
  const container = document.getElementById('task-list-container');
  const calContainer = document.getElementById('calendar-container');
  if (filter === 'calendar') {
    container.style.display = 'none';
    calContainer.style.display = 'block';
    renderCalendar();
    return;
  }
  container.style.display = '';
  calContainer.style.display = 'none';
  if (filter === 'bydate') { renderByDate(); return; }
  const filtered = getFiltered();
  if (filter !== 'all') {
    container.innerHTML = filtered.length
      ? `<div class="task-list">${filtered.map(renderTask).join('')}</div>`
      : `<div class="empty-state"><div class="emoji">✨</div><h3>Nothing here</h3><p>No tasks match this filter.</p></div>`;
    return;
  }
  const daily       = getSorted(tasks.filter(t => t.recurrence === 'daily'    && matchesSearch(t)));
  const weekly      = getSorted(tasks.filter(t => t.recurrence === 'weekly'   && matchesSearch(t)));
  const biweekly    = getSorted(tasks.filter(t => t.recurrence === 'biweekly' && matchesSearch(t)));
  const monthly     = getSorted(tasks.filter(t => t.recurrence === 'monthly'  && matchesSearch(t)));
  const independent = getSorted(tasks.filter(t => t.recurrence === 'none'     && matchesSearch(t)));
  let html = '';
  html += renderSection('Daily',    'daily',       '🔁', daily);
  html += renderSection('Weekly',   'weekly',      '📅', weekly);
  html += renderSection('Biweekly', 'biweekly',    '🔂', biweekly);
  html += renderSection('Monthly',  'monthly',     '🗓', monthly);
  html += renderSection('One-time', 'independent', '📌', independent);
  container.innerHTML = html ||
    `<div class="empty-state"><div class="emoji">📋</div><h3>No tasks yet</h3><p>Add your first task above to get started.</p></div>`;
}

// --- Calendar agenda ---
async function loadCalendar() {
  try {
    const res = await fetch('/api/calendar', { headers: { 'x-tasks-secret': secret } });
    if (!res.ok) return;
    const data = await res.json();
    if (!data || !data.events) return;

    const strip = document.getElementById('agenda-strip');
    const dateEl = document.getElementById('agenda-date');
    const eventsEl = document.getElementById('agenda-events');

    const todayStr = today();
    const isStale = data.date && data.date !== todayStr;

    dateEl.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    if (!data.events.length) {
      eventsEl.innerHTML = '<span class="agenda-empty">No events today</span>';
    } else {
      eventsEl.innerHTML = data.events.map(e => `
        <div class="agenda-event">
          <div class="agenda-dot"></div>
          ${e.time ? `<span class="agenda-time">${esc(e.time)}</span>` : ''}
          <span class="agenda-title">${esc(e.title)}</span>
          ${e.duration ? `<span style="font-size:0.69rem;color:var(--text-light)">${esc(e.duration)}</span>` : ''}
        </div>`).join('');
      if (isStale) {
        eventsEl.innerHTML += `<span class="agenda-stale">Updated at 10am</span>`;
      }
    }
    strip.style.display = 'block';
  } catch(e) { /* silently skip if unavailable */ }
}

// --- Keyboard shortcuts ---
document.addEventListener('keydown', e => {
  const active = document.activeElement;
  const typing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');
  if (e.key === '/' && !typing) {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if ((e.key === 'n' || e.key === 'N') && !typing) {
    e.preventDefault();
    document.getElementById('new-name').focus();
    document.getElementById('new-name').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  if (e.key === 'Escape' && typing) {
    active.blur();
    if (active.id === 'search-input') clearSearch();
    cancelEdit();
  }
});

document.getElementById('new-name').addEventListener('keydown', e => { if(e.key==='Enter') addTask(); });
document.getElementById('new-notes').addEventListener('keydown', e => { if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) addTask(); });
</script>
